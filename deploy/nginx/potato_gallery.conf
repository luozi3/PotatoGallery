server {
  listen 80;
  server_name __SERVER_NAME__;

  client_max_body_size __CLIENT_MAX_BODY_SIZE__;
  root __GALLERY_ROOT__/storage/www;
  index index.html;

  location /static/ { alias __GALLERY_ROOT__/storage/www/static/; }
  location /thumb/  { alias __GALLERY_ROOT__/storage/thumb/; }
  location /raw/    { alias __GALLERY_ROOT__/storage/raw/; }

  location = /health {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(api|upload/admin)/ {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/auth/(login|register|logout|me)$ {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
