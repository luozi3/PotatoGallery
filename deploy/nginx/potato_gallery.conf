limit_req_zone $binary_remote_addr zone=gallery_user_login:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=gallery_register:10m rate=1r/m;

map $http_x_forwarded_proto $gallery_forwarded_proto {
  default $scheme;
  ~*^https https;
  ~*^http http;
}

# Cloudflare proxy ranges. Keep in sync with https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare Tunnel commonly connects from localhost to nginx.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
  listen 80;
  server_name __SERVER_NAME__;
  limit_req_status 429;

  client_max_body_size __CLIENT_MAX_BODY_SIZE__;
  root __GALLERY_ROOT__/storage/www;
  index index.html;

  location /static/ { alias __GALLERY_ROOT__/storage/www/static/; }
  location /thumb/  { alias __GALLERY_ROOT__/storage/thumb/; }
  location /raw/    { alias __GALLERY_ROOT__/storage/raw/; }

  location = /health {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $gallery_forwarded_proto;
  }

  location = /auth/login {
    limit_req zone=gallery_user_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $gallery_forwarded_proto;
  }

  location = /auth/register {
    limit_req zone=gallery_register burst=10 nodelay;
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $gallery_forwarded_proto;
  }

  location ~ ^/(api|upload/admin)/ {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $gallery_forwarded_proto;
  }

  location ~ ^/auth/(logout|me)$ {
    proxy_pass http://127.0.0.1:__UPLOAD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $gallery_forwarded_proto;
  }
}
